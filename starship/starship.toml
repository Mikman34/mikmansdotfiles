# =========================================================
# Catppuccin Mocha — Starship prompt config
# =========================================================

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](bold fg:color_mauve)\
[ $os ](fg:color_base bg:color_mauve)\
[](fg:color_mauve bg:color_surface0)\
[ $username$hostname ](fg:color_mauve bg:color_surface0)\
[](fg:color_surface0 bg:color_yellow)\
[ $directory ](fg:color_base bg:color_yellow)\
[](fg:color_yellow)\
$git_branch\
$git_status\
$c$rust$golang$nodejs$php$java$kotlin$haskell$python\
$fill\
[$time](fg:color_subtext)\
$line_break\
[╰─](bold fg:color_mauve)$character"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
color_base    = '#1e1e2e'
color_surface0 = '#313244'
color_surface1 = '#45475a'
color_subtext  = '#a6adc8'
color_text     = '#cdd6f4'
color_mauve    = '#cba6f7'
color_blue     = '#89b4fa'
color_aqua     = '#94e2d5'
color_green    = '#a6e3a1'
color_yellow   = '#f9e2af'
color_peach    = '#fab387'
color_red      = '#f38ba8'
color_purple   = '#cba6f7'

[fill]
symbol = ' '

[os]
disabled = false
style = "fg:color_base bg:color_mauve"

[os.symbols]
Arch = ""
Linux = "󰌽"
Windows = "󰍲"
Macos = "󰀵"

[username]
show_always = true
style_user = "fg:color_mauve bg:color_surface0"
style_root = "fg:color_red bg:color_surface0"
format = '$user'

[hostname]
ssh_only = false
style = "fg:color_mauve bg:color_surface0"
format = '@$hostname'

[directory]
style = "fg:color_base bg:color_yellow"
format = "$path"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""

[git_branch]
symbol = ""
style = "fg:color_aqua"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:color_peach"
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
symbol = ""
style = "fg:color_green"
format = '[ $symbol $version ]($style)'

[python]
symbol = ""
style = "fg:color_blue"
format = '[ $symbol $version ]($style)'

[rust]
symbol = ""
style = "fg:color_peach"
format = '[ $symbol $version ]($style)'

[golang]
symbol = ""
style = "fg:color_aqua"
format = '[ $symbol $version ]($style)'

[time]
disabled = false
time_format = "%H:%M"
style = "fg:color_subtext"
format = '[ $time ]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_mauve)'
error_symbol = '[❯](bold fg:color_red)'
vimcmd_symbol = '[❮](bold fg:color_green)'
